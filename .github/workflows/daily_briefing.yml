name: Daily News Briefing

on:
  schedule:
    # 11:45 UTC corresponds to 7:45 AM EDT (Eastern Daylight Time)
    - cron: '45 11 * * *'
  workflow_dispatch: # Allows you to manually trigger a test run anytime

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Briefing Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          PASSWORD_EMAIL: ${{ secrets.PASSWORD_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python main.py

      - name: Commit updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: update news briefing history" || echo "No changes to commit"
          git push
